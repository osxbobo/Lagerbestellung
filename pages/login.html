<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#F26B2E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LAGER//APP">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login – LAGER//APP</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-ui, 'Geist', sans-serif);
      background: var(--bg); color: var(--ink);
      min-height: 100dvh; display: flex; flex-direction: column;
    }

    /* ── Nav ── */
    .l-nav {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 20px;
      background: var(--glass-bg-strong);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid var(--hairline);
    }
    .l-wordmark {
      font-family: var(--font-mono); font-weight: 600; font-size: 0.95rem;
      color: var(--brand); letter-spacing: -0.01em;
    }
    .l-wordmark .slash { color: var(--ink-3); }
    .l-right { margin-left: auto; }
    .l-theme {
      width: 34px; height: 34px; border-radius: 9px;
      border: 1px solid var(--hairline-2); background: var(--surface-2);
      cursor: pointer; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Layout ── */
    .l-main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 32px 20px;
    }
    .l-box {
      width: 100%; max-width: 400px;
      display: flex; flex-direction: column; gap: 28px;
    }

    /* ── Header ── */
    .l-header { text-align: center; display: flex; flex-direction: column; gap: 6px; }
    .l-icon {
      width: 60px; height: 60px; border-radius: 18px;
      background: var(--brand-soft); border: 1px solid rgba(242, 107, 46, 0.2);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 8px;
    }
    .l-icon svg { color: var(--brand); }
    .l-logo {
      font-family: var(--font-mono); font-size: 1rem; font-weight: 600;
      color: var(--brand);
    }
    .l-logo .slash { color: var(--ink-3); }
    .l-title { font-size: 1.4rem; font-weight: 700; color: var(--ink); }
    .l-sub { font-size: 0.82rem; color: var(--ink-3); }

    /* ── Card ── */
    .l-card {
      background: var(--surface); border: 1px solid var(--hairline);
      border-radius: 20px; padding: 28px;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* Fields */
    .l-group { display: flex; flex-direction: column; gap: 5px; }
    .l-label {
      font-size: 0.72rem; font-weight: 600; color: var(--ink-3);
      font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em;
    }
    .l-input {
      background: var(--surface-2); border: 1.5px solid var(--hairline-2);
      border-radius: 10px; padding: 12px 14px;
      font-family: var(--font-ui); font-size: 0.95rem; color: var(--ink);
      outline: none; width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .l-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-soft);
    }
    .l-input::placeholder { color: var(--ink-4); }

    /* Error */
    .l-error {
      background: rgba(220, 38, 38, 0.08); border: 1px solid rgba(220, 38, 38, 0.25);
      color: var(--crit); border-radius: 10px; padding: 10px 14px;
      font-size: 0.82rem; text-align: center;
    }

    /* Buttons */
    .l-btn-primary {
      width: 100%; height: 50px; border-radius: 12px; border: none;
      background: var(--brand); color: #fff;
      font-family: var(--font-ui); font-size: 0.95rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity 0.15s;
    }
    .l-btn-primary:hover { opacity: 0.9; }
    .l-btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    .l-btn-ghost {
      width: 100%; height: 48px; border-radius: 12px;
      border: 1.5px solid var(--hairline-2); background: var(--surface-2);
      color: var(--ink-2); font-family: var(--font-ui); font-size: 0.9rem; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      text-decoration: none; transition: background 0.15s;
    }
    .l-btn-ghost:hover { background: var(--surface-3); }

    /* Divider */
    .l-divider {
      display: flex; align-items: center; gap: 12px;
      color: var(--ink-4); font-size: 0.72rem; font-family: var(--font-mono);
    }
    .l-divider::before, .l-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--hairline);
    }

    /* Footer note */
    .l-footer { text-align: center; font-size: 0.8rem; color: var(--ink-4); }
    .l-footer a { color: var(--brand); text-decoration: none; }

    /* Spinner */
    .spinner-sm {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <nav class="l-nav">
    <div class="l-wordmark">LAGER<span class="slash">//</span>APP</div>
    <div class="l-right">
      <button class="l-theme" id="theme-toggle" onclick="toggleTheme()">☀️</button>
    </div>
  </nav>

  <main class="l-main">
    <div class="l-box">

      <div class="l-header">
        <div class="l-icon">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <div class="l-logo">LAGER<span class="slash">//</span>APP</div>
        <h1 class="l-title">Anmelden</h1>
        <p class="l-sub">Wachenleiter &amp; Admin Zugang</p>
      </div>

      <div class="l-card">
        <div class="l-group">
          <label class="l-label" for="email">E-Mail</label>
          <input type="email" id="email" class="l-input"
            placeholder="name@drk-boeblingen.de" autocomplete="email">
        </div>

        <div class="l-group">
          <label class="l-label" for="password">Passwort</label>
          <input type="password" id="password" class="l-input"
            placeholder="••••••••" autocomplete="current-password">
        </div>

        <div id="error-msg" class="l-error hidden"></div>

        <button class="l-btn-primary" id="btn-login" onclick="doLogin()">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="14" height="10" rx="2"/><path d="M7 8V6a3 3 0 0 1 6 0v2"/></svg>
          Anmelden
        </button>

        <div class="l-divider">oder</div>

        <a href="../index.html" class="l-btn-ghost">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="9" cy="9" r="6"/><path d="m17 17-3.5-3.5"/></svg>
          Zur Lagersuche
        </a>
      </div>

      <div class="l-footer">
        Mitarbeiter? <a href="../index.html">→ Zum Lagercheck</a>
      </div>

    </div>
  </main>

  <script type="module">
    import { initializeApp }         from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword }
                                     from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc }
                                     from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { firebaseConfig }        from "../js/firebase-config.js";

    // Theme
    const savedTheme  = localStorage.getItem('lager-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme       = savedTheme || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙';

    window.toggleTheme = function() {
      const cur  = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('lager-theme', next);
      document.getElementById('theme-toggle').textContent = next === 'dark' ? '☀️' : '🌙';
    };

    // Firebase
    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // Already logged in? Anonyme Nutzer (PIN-Login) ignorieren
    auth.onAuthStateChanged(async user => {
      if (user && !user.isAnonymous) {
        const role = await getRole(user.uid);
        redirectByRole(role);
      }
    });

    async function getRole(uid) {
      try {
        const snap = await getDoc(doc(db, 'users', uid));
        return snap.exists() ? snap.data().role : 'mitarbeiter';
      } catch { return 'mitarbeiter'; }
    }

    function redirectByRole(role) {
      if (role === 'admin')             window.location.href = 'admin.html';
      else if (role === 'wachenleiter') window.location.href = 'portal.html';
      else window.location.href = '../index.html';
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    window.doLogin = async function() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('btn-login');

      if (!email || !password) { showError('Bitte E-Mail und Passwort eingeben.'); return; }

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner-sm"></div> Anmelden…';
      document.getElementById('error-msg').classList.add('hidden');

      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const role = await getRole(cred.user.uid);
        redirectByRole(role);
      } catch (e) {
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="14" height="10" rx="2"/><path d="M7 8V6a3 3 0 0 1 6 0v2"/></svg> Anmelden';
        const msgs = {
          'auth/user-not-found':     'E-Mail nicht gefunden.',
          'auth/wrong-password':     'Falsches Passwort.',
          'auth/invalid-email':      'Ungültige E-Mail-Adresse.',
          'auth/too-many-requests':  'Zu viele Versuche. Bitte warte kurz.',
          'auth/invalid-credential': 'E-Mail oder Passwort falsch.',
        };
        showError(msgs[e.code] || `Fehler: ${e.message}`);
      }
    };

    // Enter key
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  </script>

  <script src="../js/pwa.js"></script>
</body>
</html>
