<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#F26B2E">
  <title>Verfallsscan – LAGER//APP</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="/lagerapp_alpha/icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <!-- Firebase SDK (global, kein ES Module) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <!-- ZXing -->
  <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
  <link rel="stylesheet" href="../css/main.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: var(--font-ui, 'Geist', sans-serif); background: var(--bg); color: var(--ink); min-height: 100dvh; }

    /* ── Nav ── */
    .s-nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px;
      background: var(--glass-bg-strong);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid var(--hairline);
    }
    .s-back {
      height: 34px; padding: 0 12px; border-radius: 8px;
      border: 1px solid var(--hairline-2); background: var(--surface-2);
      color: var(--ink-2); font-family: var(--font-ui); font-size: 0.82rem; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .s-back svg { flex-shrink: 0; }
    .s-wordmark {
      font-family: var(--font-mono); font-weight: 600; font-size: 0.9rem;
      color: var(--brand); letter-spacing: -0.01em;
    }
    .s-wordmark .slash { color: var(--ink-3); }
    .s-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .s-user { font-size: 0.72rem; color: var(--ink-4); font-family: var(--font-mono); }
    .s-theme {
      width: 32px; height: 32px; border-radius: 8px;
      border: 1px solid var(--hairline-2); background: var(--surface-2);
      cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
    }

    /* ── Page layout ── */
    .s-page { padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 500px; margin: 0 auto; padding-bottom: 40px; }

    /* ── Camera section ── */
    .s-cam-section {
      border-radius: 20px; overflow: hidden;
      background: #000;
      position: relative;
    }

    /* Toggle row above camera */
    .s-toggle-row { display: flex; gap: 8px; }
    .s-toggle {
      flex: 1; height: 46px; border-radius: 12px;
      border: 1px solid var(--hairline-2); background: var(--surface-2);
      color: var(--ink-2); font-family: var(--font-ui); font-size: 0.85rem; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .s-toggle svg { opacity: 0.7; }
    .s-toggle.on {
      background: var(--brand); border-color: var(--brand); color: #fff;
    }
    .s-toggle.on svg { opacity: 1; }
    .s-toggle.bt-on {
      background: rgba(22, 163, 74, 0.12); border-color: var(--ok); color: var(--ok);
    }

    /* ── Full-screen camera overlay ── */
    .cam-fs {
      position: fixed; inset: 0; z-index: 200;
      background: #000;
      display: flex; flex-direction: column;
    }
    .cam-video-area { flex: 1; position: relative; overflow: hidden; min-height: 0; }
    #video { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Status pill */
    .cam-status-row {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 14px; right: 14px;
      display: flex; align-items: center; gap: 8px;
      pointer-events: none; z-index: 10;
    }
    .cam-pill {
      flex: 1; height: 36px; padding: 0 14px; border-radius: 999px;
      display: flex; align-items: center; gap: 8px;
      background: rgba(14,14,18,.72);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 0.5px solid rgba(255,255,255,.10);
      color: rgba(255,255,255,.9); font-size: 12px; font-weight: 500;
    }
    .cam-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      background: var(--brand); box-shadow: 0 0 7px var(--brand);
      animation: pulse 1.8s ease infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    .cam-close-btn {
      pointer-events: all; flex-shrink: 0;
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: rgba(14,14,18,.72);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 0.5px solid rgba(255,255,255,.10);
      color: rgba(255,255,255,.85); font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    /* Reticle 240×240 */
    .cam-reticle-wrap {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; pointer-events: none;
    }
    .cam-reticle { position: relative; width: 240px; height: 240px; }
    .cam-reticle .corner { position: absolute; width: 32px; height: 32px; }
    .cam-reticle .corner.tl { top: 0; left: 0; }
    .cam-reticle .corner.tr { top: 0; right: 0; }
    .cam-reticle .corner.bl { bottom: 0; left: 0; }
    .cam-reticle .corner.br { bottom: 0; right: 0; }
    .scan-line {
      position: absolute; left: 10px; right: 10px; height: 2px;
      background: var(--brand);
      box-shadow: 0 0 24px 6px rgba(242,107,46,.6);
      border-radius: 1px;
      animation: scanline 2s ease-in-out infinite;
    }
    @keyframes scanline { 0%,100%{top:10%;} 50%{top:84%;} }
    .cam-hint-text {
      font-family: var(--font-mono); font-size: 11px; font-weight: 600;
      color: rgba(255,255,255,.45); letter-spacing: 0.08em; text-transform: uppercase;
    }

    /* Glass bottom sheet */
    .scan-sheet {
      background: rgba(12,14,18,.82);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border-top: 0.5px solid rgba(255,255,255,.10);
      border-radius: 26px 26px 0 0;
      padding: 10px 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    .sheet-drag {
      width: 36px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,.22); margin: 0 auto 14px;
    }
    .sheet-result {
      display: none; gap: 12px; align-items: flex-start; margin-bottom: 14px;
    }
    .sheet-result.show { display: flex; }
    .sheet-art-photo {
      width: 52px; height: 52px; border-radius: 10px; flex-shrink: 0;
      background: rgba(255,255,255,.08);
      display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
      overflow: hidden;
    }
    .sheet-art-photo img { width: 100%; height: 100%; object-fit: cover; }
    .sheet-gtin { font-family: var(--font-mono); font-size: 10px; color: rgba(255,255,255,.45); margin-bottom: 3px; }
    .sheet-artname { font-size: 14px; font-weight: 700; color: rgba(255,255,255,.92); }
    .sheet-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .sheet-field label {
      display: block; font-size: 9px; font-weight: 600; color: rgba(255,255,255,.4);
      font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px;
    }
    .sheet-field input {
      width: 100%; height: 42px; padding: 0 12px;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
      color: rgba(255,255,255,.9); font-family: var(--font-mono); font-size: 13px;
      outline: none;
    }
    .sheet-field input.filled { border-color: var(--ok); background: rgba(22,163,74,.12); }
    .sheet-field input:focus  { border-color: var(--brand); }
    .sheet-verfall-info { font-size: 10px; font-family: var(--font-mono); margin-top: 3px; min-height: 14px; }
    .sheet-actions { display: flex; gap: 8px; }
    .sheet-ctrl {
      width: 44px; height: 44px; border-radius: 10px; border: none;
      background: rgba(255,255,255,.10); color: rgba(255,255,255,.8);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background .15s;
    }
    .sheet-ctrl.on { background: var(--brand); }
    .sheet-ctrl:active { opacity: 0.7; }
    .sheet-save {
      flex: 1; height: 44px; border-radius: 10px; border: none;
      background: var(--ok); color: #fff;
      font-family: var(--font-ui); font-size: 14px; font-weight: 700;
      cursor: pointer; touch-action: manipulation;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      box-shadow: 0 4px 12px rgba(22,163,74,.3);
    }
    .sheet-save.unknown { background: var(--brand); box-shadow: 0 4px 12px rgba(242,107,46,.3); }
    .sheet-save:active { opacity: 0.85; }

    /* Camera controls row (legacy, keep for compat) */
    .cam-ctrl-row { display: none; }
    .cam-ctrl { display: none; }

    /* BT hint */
    .bt-hint {
      display: none; padding: 10px 14px;
      background: rgba(22, 163, 74, 0.1); border: 1px solid rgba(22, 163, 74, 0.3);
      border-radius: 12px; font-size: 0.78rem; color: var(--ok); font-weight: 500;
    }
    .bt-hint.show { display: block; }

    /* ── Form section ── */
    .s-card {
      background: var(--surface); border: 1px solid var(--hairline);
      border-radius: 18px; overflow: hidden;
    }
    .s-card-head {
      padding: 10px 16px; background: var(--surface-2);
      border-bottom: 1px solid var(--hairline);
      font-size: 0.7rem; font-weight: 600; color: var(--ink-3);
      font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.07em;
    }
    .s-card-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    /* Fields */
    .s-field { display: flex; flex-direction: column; gap: 4px; }
    .s-label {
      font-size: 0.6rem; font-weight: 700; color: var(--ink-4);
      font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em;
    }
    input.s-inp, select.s-inp {
      width: 100%; padding: 11px 14px; border-radius: 10px;
      border: 1.5px solid var(--hairline-2); background: var(--surface-2);
      color: var(--ink); font-family: var(--font-ui); font-size: 0.95rem;
      outline: none; -webkit-appearance: none; appearance: none;
      transition: border-color 0.15s;
    }
    input.s-inp:focus, select.s-inp:focus { border-color: var(--brand); }
    input.s-inp.filled { border-color: var(--ok); background: rgba(22, 163, 74, 0.06); }
    select.s-inp { appearance: auto; -webkit-appearance: auto; }

    /* Suggestions */
    .suggestions {
      display: flex; flex-direction: column; gap: 3px;
      margin-top: 4px; max-height: 200px; overflow-y: auto;
    }
    .sug {
      padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--hairline);
      border-radius: 10px; cursor: pointer; touch-action: manipulation;
    }
    .sug:active { background: var(--brand-soft); border-color: var(--brand); }
    .sug-name { font-size: 0.85rem; font-weight: 600; color: var(--ink); }
    .sug-lp { font-size: 0.7rem; color: var(--ink-4); font-family: var(--font-mono); }

    /* Selected artikel */
    .artikel-sel {
      padding: 9px 12px; background: rgba(22, 163, 74, 0.08);
      border: 1px solid rgba(22, 163, 74, 0.3); border-radius: 10px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .artikel-sel span { font-size: 0.85rem; font-weight: 600; color: var(--ok); }
    .artikel-sel button { background: none; border: none; color: var(--ink-4); cursor: pointer; font-size: 1rem; padding: 2px 6px; }

    /* Verfall info */
    .verfall-info { font-size: 0.72rem; font-family: var(--font-mono); margin-top: 2px; }

    /* Chargen list */
    .charge {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; background: var(--surface-2); border-radius: 8px;
      font-size: 0.75rem; font-family: var(--font-mono);
    }
    .charge-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .charge-del { margin-left: auto; background: none; border: none; color: var(--ink-4); cursor: pointer; font-size: 0.9rem; flex-shrink: 0; }

    /* Buttons */
    .s-btn-row { display: flex; gap: 8px; }
    .s-reset {
      flex: 0 0 auto; height: 50px; padding: 0 16px; border-radius: 12px;
      border: 1.5px solid var(--hairline-2); background: var(--surface-2);
      color: var(--ink-2); font-family: var(--font-ui); font-size: 0.85rem; font-weight: 500;
      cursor: pointer;
    }
    .s-save {
      flex: 1; height: 50px; border-radius: 12px; border: none;
      background: var(--ok); color: #fff;
      font-family: var(--font-ui); font-size: 1rem; font-weight: 600;
      cursor: pointer; touch-action: manipulation;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .s-save:active { opacity: 0.85; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 10px 20px; border-radius: 12px; font-size: 0.82rem; font-weight: 600;
      color: #fff; z-index: 9999; white-space: nowrap; animation: up 0.2s ease;
    }
    @keyframes up { from { opacity: 0; transform: translateX(-50%) translateY(6px); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ── Full-screen camera overlay ── -->
  <div id="cam-overlay" class="cam-fs hidden">
    <div class="cam-video-area">
      <video id="video" playsinline autoplay muted></video>
      <!-- Status pill -->
      <div class="cam-status-row">
        <div class="cam-pill">
          <span class="cam-dot"></span>
          <span id="cam-status-text">Scanne GS1-DataMatrix</span>
        </div>
        <button class="cam-close-btn" onclick="stopCam()">✕</button>
      </div>
      <!-- Reticle 240×240 -->
      <div class="cam-reticle-wrap">
        <div class="cam-reticle">
          <svg class="corner tl" viewBox="0 0 32 32" fill="none"><path d="M0 24V0h24" stroke="#F26B2E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="corner tr" viewBox="0 0 32 32" fill="none"><path d="M32 24V0H8"  stroke="#F26B2E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="corner bl" viewBox="0 0 32 32" fill="none"><path d="M0 8v24h24"  stroke="#F26B2E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="corner br" viewBox="0 0 32 32" fill="none"><path d="M32 8v24H8"  stroke="#F26B2E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div class="scan-line"></div>
        </div>
        <div class="cam-hint-text">Code zentrieren · Halten</div>
      </div>
    </div>

    <!-- Glass bottom sheet -->
    <div class="scan-sheet">
      <div class="sheet-drag"></div>
      <!-- Scan result (shown after scan) -->
      <div class="sheet-result" id="sheet-result">
        <div class="sheet-art-photo" id="sheet-art-photo">📦</div>
        <div style="flex:1;min-width:0;">
          <div class="sheet-gtin" id="sheet-gtin"></div>
          <div class="sheet-artname" id="sheet-artname">Artikel suchen…</div>
          <div style="margin-top:5px;" id="sheet-art-chip"></div>
        </div>
      </div>
      <!-- Fields -->
      <div class="sheet-fields">
        <div class="sheet-field">
          <label>Charge / LOT</label>
          <input type="text" id="sheet-lot" autocomplete="off" maxlength="50" placeholder="z.B. 140211">
        </div>
        <div class="sheet-field">
          <label>Verfallsdatum</label>
          <input type="text" id="sheet-verfall" inputmode="numeric" maxlength="10" placeholder="JJJJ-MM-TT"
            oninput="formatVerfallInput(this); showSheetVerfallInfo()">
          <div class="sheet-verfall-info" id="sheet-verfall-info"></div>
        </div>
      </div>
      <!-- Actions -->
      <div class="sheet-actions">
        <button class="sheet-ctrl" id="sheet-flip" onclick="flipCam()" title="Kamera wechseln">
          <svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h5v5M16 16h-5v-5M4 4l4 4M16 16l-4-4M4 12a8 8 0 0 1 8-8M16 8a8 8 0 0 1-8 8"/></svg>
        </button>
        <button class="sheet-ctrl" id="sheet-light" onclick="toggleLight()" title="Licht">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>
        </button>
        <button class="sheet-save" id="sheet-save-btn" onclick="saveFromSheet()">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10l4 4 6-6"/></svg>
          Charge speichern
        </button>
      </div>
    </div>
  </div>

  <nav class="s-nav">
    <button class="s-back" onclick="history.back()">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5l-5 5 5 5"/></svg>
      Zurück
    </button>
    <div class="s-wordmark">LAGER<span class="slash">//</span>APP</div>
    <div class="s-right">
      <span class="s-user" id="nav-user"></span>
      <button class="s-theme" onclick="toggleTheme()">☀️</button>
    </div>
  </nav>

  <div class="s-page">

    <!-- Camera + BT controls -->
    <div class="s-toggle-row">
      <button class="s-toggle" id="btn-cam" onclick="toggleCam()">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7a2 2 0 0 1 2-2h1l2-2h6l2 2h1a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7z"/><circle cx="10" cy="10.5" r="2.5"/></svg>
        Kamera öffnen
      </button>
      <button class="s-toggle" id="btn-bt" onclick="toggleBT()">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6l6 6-3 3V4l3 3-6 6"/></svg>
        Bluetooth
      </button>
    </div>

    <!-- BT hint -->
    <div class="bt-hint" id="bt-hint">
      Bluetooth aktiv – Code scannen um Felder automatisch auszufüllen
    </div>

    <!-- Charge erfassen -->
    <div class="s-card">
      <div class="s-card-head">Charge erfassen</div>
      <div class="s-card-body">

        <!-- Artikel -->
        <div class="s-field">
          <div class="s-label">Artikel</div>
          <div id="artikel-sel-wrap" class="hidden">
            <div class="artikel-sel">
              <span id="artikel-sel-name"></span>
              <button onclick="clearArtikel()">✕</button>
            </div>
          </div>
          <div id="artikel-search-wrap">
            <input type="text" id="inp-search" class="s-inp" placeholder="Artikel suchen…"
              autocomplete="off" oninput="doSearch(this.value)">
            <div class="suggestions" id="suggestions"></div>
          </div>
        </div>

        <!-- LOT -->
        <div class="s-field">
          <div class="s-label">Charge / LOT</div>
          <input type="text" id="inp-lot" class="s-inp" placeholder="z. B. 140211" autocomplete="off" maxlength="50">
        </div>

        <!-- Verfall -->
        <div class="s-field">
          <div class="s-label">Verfallsdatum</div>
          <input type="text" id="inp-verfall" class="s-inp" inputmode="numeric"
            placeholder="JJJJ-MM-TT" maxlength="10"
            oninput="formatVerfallInput(this); showVerfallInfo()">
          <div class="verfall-info" id="verfall-info"></div>
        </div>

        <!-- Actions -->
        <div class="s-btn-row">
          <button class="s-reset" onclick="resetForm()">↺ Neu</button>
          <button class="s-save" onclick="saveCharge()">
            <svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10l4 4 6-6"/></svg>
            Charge speichern
          </button>
        </div>

        <!-- Chargen Liste -->
        <div id="chargen-wrap" class="hidden">
          <div class="s-label" style="margin-bottom:6px;">Gespeicherte Chargen</div>
          <div id="chargen-list" style="display:flex;flex-direction:column;gap:5px;"></div>
        </div>

      </div>
    </div>

  </div>

  <script>
    // Theme
    (function(){
      const t = localStorage.getItem('lager-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
      document.addEventListener('DOMContentLoaded', () => {
        const btn = document.querySelector('.s-theme');
        if (btn) btn.textContent = t === 'dark' ? '☀️' : '🌙';
      });
    })();
    function toggleTheme() {
      const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('lager-theme', t);
      document.querySelector('.s-theme').textContent = t === 'dark' ? '☀️' : '🌙';
    }
  </script>

  <script>
    // ── Firebase Init (compat SDK – global verfügbar) ──
    const firebaseConfig = {
      apiKey:            "AIzaSyD1YY-cFQxyykfYQYPORwulzuF8t6Wgid4",
      authDomain:        "lagerbestellung-19970.firebaseapp.com",
      projectId:         "lagerbestellung-19970",
      storageBucket:     "lagerbestellung-19970.firebasestorage.app",
      messagingSenderId: "939056339904",
      appId:             "1:939056339904:web:6f33ca2f5a4cebd2780625"
    };
    firebase.initializeApp(firebaseConfig);
    const db   = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    const auth = firebase.auth();

    // ── State ──
    let artikel   = [];
    let selected  = null;
    let camOn     = false;
    let btOn      = false;
    let reader    = null;
    let camSide   = 'back';
    let buf       = '';
    let bufTimer  = null;

    // ── Auth ──
    auth.onAuthStateChanged(async user => {
      const pinOk = sessionStorage.getItem('lager-pin-auth') || localStorage.getItem('lager-pin-auth');
      if (!user && !pinOk) {
        const ret = encodeURIComponent(window.location.pathname + window.location.search);
        window.location.replace(`login.html?tab=mitarbeiter&return=${ret}`);
        return;
      }
      const name = user?.displayName || user?.email
        || sessionStorage.getItem('lager-pin-name') || localStorage.getItem('lager-pin-name')
        || localStorage.getItem('lager-saved-name') || '';
      document.getElementById('nav-user').textContent = name;
      await load();
      if (localStorage.getItem('camera-auto-start') === '1') startCam();
    });

    // ── Artikel laden ──
    async function load() {
      const snap = await db.collection('artikel').get();
      artikel = snap.docs.map(d => ({id:d.id,...d.data()}))
        .sort((a,b) => (a.name||'').localeCompare(b.name||''));
    }

    // ── GS1 Parser ──
    function parseGS1(raw) {
      const r = {gtin:null, lot:null, verfall:null};
      const s = raw.replace(/[\x00-\x1F\x7F]/g,'').trim();

      // Mit Klammern
      if (s.includes('(')) {
        const g = s.match(/\(01\)(\d{14})/);
        const l = s.match(/\(10\)([^\(]+)/i);
        const v = s.match(/\(17\)(\d{6})/);
        if (g) r.gtin = g[1];
        if (l) r.lot  = l[1].trim();
        if (v) {
          const d = v[1];
          const yy=parseInt(d.substring(0,2)), mm=parseInt(d.substring(2,4));
          let dd=parseInt(d.substring(4,6));
          if (mm>=1&&mm<=12&&yy>=20&&yy<=40) {
            if (dd===0) dd = new Date(2000+yy, mm, 0).getDate();
            r.verfall = `20${String(yy).padStart(2,'0')}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
          }
        }
        return r;
      }

      // Ohne Klammern – sequentiell alle AIs lesen
      if (s.startsWith('01') && s.length >= 16) {
        r.gtin = s.substring(2,16);
        const rest = s.substring(16);

        // Verfall suchen (17 + YYMMDD mit gültigem Datum)
        const m17 = rest.match(/17([2-3]\d)(0[1-9]|1[0-2])(\d{2})/);
        if (m17) {
          const yy=parseInt(m17[1]), mm=parseInt(m17[2]);
          let dd=parseInt(m17[3]);
          if (dd===0) dd = new Date(2000+yy, mm, 0).getDate();
          r.verfall = `20${String(yy).padStart(2,'0')}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
        }

        // LOT suchen (10 + alphanumerisch)
        const m10 = rest.match(/10([A-Z0-9]+?)(?:17[0-9]{6}|11[0-9]{6}|30[0-9]{1,8}|$)/i);
        if (m10) {
          r.lot = m10[1].trim();
        } else {
          const idx10 = rest.indexOf('10');
          if (idx10 >= 0) {
            const afterLot = rest.substring(idx10 + 2);
            const m17pos  = afterLot.match(/17[2-3]\d(0[1-9]|1[0-2])\d{2}/);
            r.lot = m17pos ? afterLot.substring(0, m17pos.index).trim() : afterLot.trim();
          }
        }
      }
      return r;
    }

    // ── HIBC Parser ──
    function parseHIBC(raw) {
      const r = {gtin:null, lot:null, verfall:null};
      const parts = raw.split('/$$');
      if (parts.length < 2) return r;
      const sec = parts[1];
      const mm  = parseInt(sec.substring(0,2));
      const yy  = 2000 + parseInt(sec.substring(2,4));
      if (mm>=1&&mm<=12&&yy>=2020&&yy<=2040) {
        const last = new Date(yy,mm,0).getDate();
        r.verfall = `${yy}-${String(mm).padStart(2,'0')}-${String(last).padStart(2,'0')}`;
        const lot = sec.substring(4);
        r.lot = lot.length > 1 ? lot.slice(0,-1).trim() : lot.trim();
      }
      return r;
    }

    // ── Scan Result ──
    function onScan(raw, source) {
      if (!raw || raw.trim().length < 6) return;
      const rawTrimmed = raw.trim();
      // Dedup nur für Kamera (scannt kontinuierlich) – BT immer durchlassen
      if (source === 'cam') {
        if (window._lastScannedCode === rawTrimmed) return;
        window._lastScannedCode = rawTrimmed;
        setTimeout(() => { if (window._lastScannedCode === rawTrimmed) window._lastScannedCode = null; }, 1000);
      }
      if (navigator.vibrate) navigator.vibrate(80);
      const parsed = raw.startsWith('+') || raw.startsWith('/') ? parseHIBC(raw) : parseGS1(raw);

      lastParsed = parsed;

      // 1. Alles zurücksetzen
      selected = null;
      document.getElementById('inp-lot').value       = '';
      document.getElementById('inp-verfall').value    = '';
      document.getElementById('inp-lot').classList.remove('filled');
      document.getElementById('inp-verfall').classList.remove('filled');
      document.getElementById('verfall-info').textContent = '';
      document.getElementById('artikel-search-wrap').classList.remove('hidden');
      document.getElementById('artikel-sel-wrap').classList.add('hidden');
      document.getElementById('chargen-wrap').classList.add('hidden');
      document.getElementById('inp-search').value    = '';
      document.getElementById('suggestions').innerHTML = '';

      // 2. Artikel automatisch finden
      let foundArtikel = null;
      if (parsed.gtin) {
        foundArtikel = artikel.find(x =>
          x.gtin === parsed.gtin ||
          (Array.isArray(x.gtins) && x.gtins.includes(parsed.gtin)) ||
          (x.chargen||[]).some(c => c.gtin === parsed.gtin)
        );
        if (foundArtikel) selectArtikel(foundArtikel);
      }

      // 3. LOT + Verfall NACH dem Reset einfüllen
      if (parsed.lot) {
        document.getElementById('inp-lot').value = parsed.lot;
        document.getElementById('inp-lot').classList.add('filled');
        document.getElementById('sheet-lot').value = parsed.lot;
        document.getElementById('sheet-lot').classList.add('filled');
      }
      if (parsed.verfall) {
        document.getElementById('inp-verfall').value = parsed.verfall;
        document.getElementById('inp-verfall').classList.add('filled');
        document.getElementById('sheet-verfall').value = parsed.verfall;
        document.getElementById('sheet-verfall').classList.add('filled');
        showVerfallInfo();
        showSheetVerfallInfo();
      }

      // 4. Sheet-Result befüllen (nur bei Kamera-Scan)
      if (source === 'cam') {
        const resultEl  = document.getElementById('sheet-result');
        const photoEl   = document.getElementById('sheet-art-photo');
        const gtinEl    = document.getElementById('sheet-gtin');
        const nameEl    = document.getElementById('sheet-artname');
        const chipEl    = document.getElementById('sheet-art-chip');
        const saveBtn   = document.getElementById('sheet-save-btn');

        resultEl.classList.add('show');
        gtinEl.textContent  = parsed.gtin ? `GTIN ${parsed.gtin}` : '';

        if (foundArtikel) {
          nameEl.textContent = foundArtikel.name;
          photoEl.innerHTML  = foundArtikel.fotoUrl
            ? `<img src="${foundArtikel.fotoUrl}" alt="${foundArtikel.name}">` : '📦';
          chipEl.innerHTML   = `<span class="la-chip ok" style="height:18px;font-size:10px;"><span class="dot"></span>Bekannt</span>`;
          saveBtn.classList.remove('unknown');
          saveBtn.innerHTML  = `<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10l4 4 6-6"/></svg> Charge speichern`;
        } else {
          nameEl.textContent = parsed.gtin ? 'Unbekannter Artikel' : 'Code erkannt';
          photoEl.innerHTML  = '❓';
          chipEl.innerHTML   = `<span class="la-chip low" style="height:18px;font-size:10px;"><span class="dot"></span>Unbekannt</span>`;
          saveBtn.classList.add('unknown');
          saveBtn.innerHTML  = `<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5v10M5 10h10"/></svg> Artikel zuordnen`;
        }
      }

      toast('✅ Code erkannt');
    }

    // ── Artikel Suche ──
    function doSearch(q) {
      const el = document.getElementById('suggestions');
      if (!q || q.length < 2) { el.innerHTML=''; return; }
      const hits = artikel.filter(a =>
        a.name?.toLowerCase().includes(q.toLowerCase()) ||
        a.lp?.toLowerCase().includes(q.toLowerCase()) ||
        (a.aliases||[]).some(al => al.toLowerCase().includes(q.toLowerCase()))
      ).slice(0,8);
      el.innerHTML = '';
      hits.forEach(a => {
        const d = document.createElement('div');
        d.className = 'sug';
        const nm = document.createElement('div'); nm.className = 'sug-name'; nm.textContent = a.name;
        const lp = document.createElement('div'); lp.className = 'sug-lp';  lp.textContent = a.lp || '';
        d.appendChild(nm); d.appendChild(lp);
        d.addEventListener('click', () => selectArtikel(a));
        el.appendChild(d);
      });
    }

    function selectArtikel(a) {
      selected = a;
      document.getElementById('inp-search').value = '';
      document.getElementById('suggestions').innerHTML = '';
      document.getElementById('artikel-search-wrap').classList.add('hidden');
      document.getElementById('artikel-sel-wrap').classList.remove('hidden');
      document.getElementById('artikel-sel-name').textContent = a.name;
      showChargen(a);
    }

    function clearArtikel() {
      selected = null;
      document.getElementById('artikel-search-wrap').classList.remove('hidden');
      document.getElementById('artikel-sel-wrap').classList.add('hidden');
      document.getElementById('chargen-wrap').classList.add('hidden');
    }

    // ── Verfall Input Formatter ──
    function formatVerfallInput(el) {
      let digits = el.value.replace(/\D/g, '').substring(0, 8);
      let formatted = digits;
      if (digits.length > 4) formatted = digits.slice(0,4) + '-' + digits.slice(4);
      if (digits.length > 6) formatted = digits.slice(0,4) + '-' + digits.slice(4,6) + '-' + digits.slice(6);
      el.value = formatted;
    }

    // ── Verfall Info ──
    function showVerfallInfo() {
      const val  = document.getElementById('inp-verfall').value;
      const info = document.getElementById('verfall-info');
      if (!val || val.length < 10) { info.textContent=''; return; }
      const p    = val.split('-');
      const d    = new Date(+p[0],+p[1]-1,+p[2]);
      const heute= new Date(); heute.setHours(0,0,0,0);
      const days = Math.round((d-heute)/86400000);
      if      (days<=0)  info.innerHTML='<span style="color:var(--crit)">Abgelaufen</span>';
      else if (days<=7)  info.innerHTML=`<span style="color:var(--crit)">Kritisch – ${days} Tage</span>`;
      else if (days<=30) info.innerHTML=`<span style="color:var(--low)">${days} Tage verbleibend</span>`;
      else               info.innerHTML=`<span style="color:var(--ok)">OK – ${Math.round(days/30)} Monate</span>`;
    }

    // ── Chargen ──
    function showChargen(a) {
      const wrap = document.getElementById('chargen-wrap');
      const list = document.getElementById('chargen-list');
      const ch   = (a.chargen||[]).sort((x,y)=>(x.verfall||'').localeCompare(y.verfall||''));
      if (!ch.length) { wrap.classList.add('hidden'); return; }
      list.innerHTML = ch.map((c,i) => {
        const heute= new Date(); heute.setHours(0,0,0,0);
        const p    = c.verfall ? c.verfall.split('-') : null;
        const days = p ? Math.round((new Date(+p[0],+p[1]-1,+p[2])-heute)/86400000) : null;
        const col  = days===null?'var(--ink-4)':days<=7?'var(--crit)':days<=30?'var(--low)':'var(--ok)';
        const lbl  = days===null?'–':days<=0?'Abgelaufen':days<=30?days+'d':Math.round(days/30)+'M';
        const dt   = p ? new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('de-DE',{month:'2-digit',year:'numeric'}) : '–';
        return `<div class="charge">
          <div class="charge-dot" style="background:${col}"></div>
          <span style="flex:1;">${c.lot||'–'} · ${dt}</span>
          <span style="color:${col};font-weight:600;">${lbl}</span>
          <button class="charge-del" onclick="delCharge('${a.id}',${i})">✕</button>
        </div>`;
      }).join('');
      wrap.classList.remove('hidden');
    }

    async function delCharge(aid, idx) {
      if (!confirm('Charge löschen?')) return;
      const a = artikel.find(x => x.id === aid);
      if (!a) return;
      const ch = [...(a.chargen||[])];
      ch.splice(idx,1);
      await db.collection('artikel').doc(aid).update({chargen:ch});
      a.chargen = ch;
      if (selected?.id === aid) { selected.chargen = ch; showChargen(selected); }
    }

    // ── Speichern ──
    let lastParsed = null;

    async function saveCharge() {
      if (!selected) { toast('Bitte Artikel wählen','err'); return; }
      const lot    = document.getElementById('inp-lot').value.trim();
      const verfall= document.getElementById('inp-verfall').value;
      if (!lot && !verfall) { toast('Charge oder Datum eingeben','err'); return; }
      const saveBtn = document.querySelector('.s-save');
      if (saveBtn.disabled) return;
      saveBtn.disabled = true;

      try {
        const ref  = db.collection('artikel').doc(selected.id);
        const snap = await ref.get();
        const data = snap.data() || {};
        const ch   = [...(data.chargen||[])];
        const idx  = ch.findIndex(c => c.lot && c.lot === lot);

        const updateData = {chargen: ch};
        if (lastParsed?.gtin) {
          const existingGtins = Array.isArray(data.gtins) ? [...data.gtins] : (data.gtin ? [data.gtin] : []);
          if (!existingGtins.includes(lastParsed.gtin)) existingGtins.push(lastParsed.gtin);
          updateData.gtin  = lastParsed.gtin;
          updateData.gtins = existingGtins;
        }

        if (idx>=0) { ch[idx]={...ch[idx],verfall:verfall||ch[idx].verfall}; toast('Charge aktualisiert ✅'); }
        else { ch.push({lot:lot||'?',verfall:verfall||null,gtin:lastParsed?.gtin||null,erfasst:new Date().toISOString()}); toast('Charge gespeichert ✅'); }

        await ref.update(updateData);

        const artIdx = artikel.findIndex(a=>a.id===selected.id);
        if (artIdx>=0) { artikel[artIdx] = {...artikel[artIdx], ...updateData}; }

        resetForm();
      } catch(e) {
        toast('Fehler beim Speichern','err');
      } finally {
        saveBtn.disabled = false;
      }
    }

    function resetForm() {
      selected   = null;
      lastParsed = null;
      window._lastScannedCode = null;
      document.getElementById('inp-lot').value='';
      document.getElementById('inp-verfall').value='';
      document.getElementById('inp-lot').classList.remove('filled');
      document.getElementById('inp-verfall').classList.remove('filled');
      document.getElementById('verfall-info').textContent='';
      document.getElementById('artikel-search-wrap').classList.remove('hidden');
      document.getElementById('artikel-sel-wrap').classList.add('hidden');
      document.getElementById('chargen-wrap').classList.add('hidden');
      document.getElementById('inp-search').value='';
      document.getElementById('suggestions').innerHTML='';
    }

    // ── Kamera ──
    function toggleCam() { camOn ? stopCam() : startCam(); }

    async function startCam() {
      camOn = true;
      document.getElementById('btn-cam').classList.add('on');
      document.getElementById('cam-overlay').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      localStorage.setItem('camera-auto-start', '1');
      try {
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
          ZXing.BarcodeFormat.EAN_13,
          ZXing.BarcodeFormat.CODE_128,
          ZXing.BarcodeFormat.QR_CODE,
          ZXing.BarcodeFormat.DATA_MATRIX,
        ]);
        reader = new ZXing.BrowserMultiFormatReader(hints);
        await reader.decodeFromConstraints(
          {video:{facingMode:camSide==='back'?'environment':'user',width:{ideal:1280},height:{ideal:720}}},
          'video',
          result => { if (result) onScan(result.getText(), 'cam'); }
        );
      } catch(e) {
        if (e.name === 'NotAllowedError') localStorage.removeItem('camera-auto-start');
        toast(e.name==='NotAllowedError'?'Kamera-Zugriff verweigert':'Kamera: '+e.message,'err');
        stopCam();
      }
    }

    function stopCam() {
      camOn = false;
      document.getElementById('btn-cam').classList.remove('on');
      document.getElementById('cam-overlay').classList.add('hidden');
      document.body.style.overflow = '';
      if (reader) { try{reader.reset();}catch(e){} reader=null; }
      const v = document.getElementById('video');
      if (v.srcObject) { v.srcObject.getTracks().forEach(t=>t.stop()); v.srcObject=null; }
    }

    function flipCam() {
      camSide = camSide === 'back' ? 'front' : 'back';
      stopCam();
      setTimeout(startCam, 300);
    }

    // ── Sheet Verfall Info ──
    function showSheetVerfallInfo() {
      const val  = document.getElementById('sheet-verfall').value;
      const info = document.getElementById('sheet-verfall-info');
      if (!val || val.length < 10) { info.textContent=''; return; }
      const p    = val.split('-');
      const d    = new Date(+p[0],+p[1]-1,+p[2]);
      const heute= new Date(); heute.setHours(0,0,0,0);
      const days = Math.round((d-heute)/86400000);
      if      (days<=0)  info.innerHTML='<span style="color:var(--crit)">Abgelaufen</span>';
      else if (days<=7)  info.innerHTML=`<span style="color:var(--crit)">${days} Tage – Kritisch</span>`;
      else if (days<=30) info.innerHTML=`<span style="color:var(--low)">${days} Tage</span>`;
      else               info.innerHTML=`<span style="color:var(--ok)">OK</span>`;
    }

    // ── Save from Sheet ──
    async function saveFromSheet() {
      const lot    = document.getElementById('sheet-lot').value.trim();
      const verfall= document.getElementById('sheet-verfall').value;
      if (!selected) { toast('Artikel nicht erkannt – bitte manuell zuordnen','err'); return; }
      if (!lot && !verfall) { toast('Charge oder Datum eingeben','err'); return; }
      const btn = document.getElementById('sheet-save-btn');
      if (btn.disabled) return;
      btn.disabled = true;
      try {
        const ref  = db.collection('artikel').doc(selected.id);
        const snap = await ref.get();
        const data = snap.data() || {};
        const ch   = [...(data.chargen||[])];
        const idx  = ch.findIndex(c => c.lot && c.lot === lot);
        const updateData = {chargen: ch};
        if (lastParsed?.gtin) {
          const existingGtins = Array.isArray(data.gtins)?[...data.gtins]:(data.gtin?[data.gtin]:[]);
          if (!existingGtins.includes(lastParsed.gtin)) existingGtins.push(lastParsed.gtin);
          updateData.gtin = lastParsed.gtin; updateData.gtins = existingGtins;
        }
        if (idx>=0) { ch[idx]={...ch[idx],verfall:verfall||ch[idx].verfall}; toast('Charge aktualisiert ✅'); }
        else { ch.push({lot:lot||'?',verfall:verfall||null,gtin:lastParsed?.gtin||null,erfasst:new Date().toISOString()}); toast('Charge gespeichert ✅'); }
        await ref.update(updateData);
        const artIdx = artikel.findIndex(a=>a.id===selected.id);
        if (artIdx>=0) artikel[artIdx] = {...artikel[artIdx],...updateData};
        // sync back to page form
        document.getElementById('inp-lot').value = lot;
        document.getElementById('inp-verfall').value = verfall;
        stopCam();
        resetForm();
      } catch(e) {
        toast('Fehler beim Speichern','err');
      } finally { btn.disabled = false; }
    }

    async function toggleLight() {
      const v=document.getElementById('video');
      if (!v.srcObject) return;
      const t=v.srcObject.getVideoTracks()[0];
      if (!t) return;
      try {
        const torch=!t.getSettings().torch;
        await t.applyConstraints({advanced:[{torch}]});
        document.getElementById('cb-light').classList.toggle('on',torch);
      } catch(e) { toast('Licht nicht verfügbar'); }
    }

    // ── Bluetooth ──
    function toggleBT() {
      btOn = !btOn;
      buf = '';
      clearTimeout(bufTimer);
      document.getElementById('btn-bt').classList.toggle('bt-on', btOn);
      document.getElementById('btn-bt').querySelector('svg').style.opacity = btOn ? '1' : '0.7';
      const label = document.getElementById('btn-bt');
      label.childNodes[label.childNodes.length - 1].textContent = btOn ? ' BT Aktiv' : ' Bluetooth';
      document.getElementById('bt-hint').classList.toggle('show', btOn);
    }

    const USER_INPUTS = ['inp-search', 'inp-lot'];

    function isUserInputFocused() {
      return USER_INPUTS.includes(document.activeElement?.id);
    }

    let userTyping = false;
    let userTypingTimer = null;

    USER_INPUTS.forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('focus', () => { userTyping = true; clearTimeout(userTypingTimer); });
      el.addEventListener('blur',  () => { userTypingTimer = setTimeout(() => { userTyping = false; }, 300); });
    });

    document.addEventListener('keydown', e => {
      if (!btOn || userTyping) return;

      if (e.key === 'Enter') {
        e.preventDefault();
        clearTimeout(bufTimer);
        const code = buf.trim(); buf = '';
        if (code.length >= 4) onScan(code, 'bt');
        return;
      }

      if (e.key.length === 1) {
        e.preventDefault();
        buf += e.key;
        clearTimeout(bufTimer);
        bufTimer = setTimeout(() => {
          const code = buf.trim(); buf = '';
          if (code.length >= 4) onScan(code, 'bt');
        }, 150);
      }
    });

    // ── Toast ──
    function toast(msg,type='ok') {
      const t=document.createElement('div');
      t.className='toast'; t.textContent=msg;
      t.style.background=type==='err'?'var(--crit)':'var(--ok)';
      document.body.appendChild(t);
      setTimeout(()=>t.remove(),2500);
    }
  </script>
